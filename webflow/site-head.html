<!-- Nav (Concept 01) open/active/hover states. nav.min.js adds these classes, so Webflow's Style "Clean up" sees them as unused and deletes them. Kept here so they can't be cleaned up. -->
<style id="nc1-states">
.nc1-tab-text.nc1-active{font-weight:600}.nc1-tab-line.is-active{opacity:1}.nc1-tab-line.nc1-active{opacity:1;transform:scaleX(1)}.nc1-bl-top.is-open,.nc1-bl-top.nc1-open{transform:translateY(7px) rotate(45deg)}.nc1-bl-mid.nc1-open{opacity:0}.nc1-bl-bot.nc1-open{transform:translateY(-7px) rotate(-45deg)}.nc1-panel.nc1-open{opacity:1;visibility:visible;transform:translateY(0px)}.nc1-col.nc1-active{background-color:var(--background-dark)}.nc1-col-head.nc1-active{color:var(--white)}.nc1-col-label.nc1-active{color:var(--white)}.nc1-chev.nc1-open{border-right-color:var(--gradient-start);border-bottom-color:var(--gradient-start);transform:rotate(-135deg)}.nc1-col-rule.nc1-active{background-color:var(--medium-grey)}.nc1-link.nc1-active{color:var(--white)}.nc1-link.nc1-active.nc1-hover{background-color:var(--white);color:var(--text)}.nc1-link.fade-in.nc1-active{transition:opacity 0.6s,transform 0.6s,background-color 0.2s,color 0.2s}.nc1-link-text.nc1-active{color:var(--white)}.nc1-link-text.nc1-active.nc1-hover{color:var(--text);transform:translate(16px)}.nc1-link-arrow.nc1-active{border-top-color:var(--light-grey);border-right-color:var(--light-grey)}.nc1-link-arrow.nc1-active.nc1-hover{opacity:0;transform:translate(10px) rotate(45deg)}.nc1-link-arrow-in.nc1-hover{opacity:1;transform:translateY(-50%) rotate(45deg)}@media screen and (max-width:991px){.nc1-links.nc1-open{display:flex}}
</style>
